[package]
name = "vigil"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "VigilFYR: failover-ready CLI tool"

[[bin]]
name = "vigil"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "0.9.7"
