[package]
name = "vigil"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "VigilFYR: failover-ready CLI tool"

[[bin]]
name = "vigil"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "0.9.7"
ureq = "2"
flate2 = "1"
tar = "0.4"
walkdir = "2"
futures = "0.3"
notify = "6"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
