severity = "critical"
enabled = true

[[rule]]
id = "deny-git-config-credential-read"
description = "Block reads of Git credential configuration"
scope = ["read", "search"]
paths = ["**/.git-credentials"]
action = "deny"
severity = "high"
enabled = true

[[rule]]
id = "deny-agent-config-writes"
description = "Block writes to installed agent configurations"
scope = ["write", "delete", "rename"]
paths = [
  "**/.claude/settings.json",
  "**/.codex/config.toml",
  "**/.gemini/settings.json",
  "**/.cursor/hooks.json",
]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-env-files"
description = "Block reads, searches, and writes of env files"
scope = ["read", "search", "write"]
paths = ["**/.env", "**/.env.*"]
action = "deny"
severity = "high"
enabled = true

[[rule]]
id = "deny-secrets-dir"
description = "Block any access to secrets directories"
scope = ["read", "search", "write"]
paths = ["**/secrets/**"]
action = "deny"
severity = "high"
enabled = true

[[rule]]
id = "deny-key-files"
description = "Block access to private keys and certificates"
scope = ["read", "search", "write"]
paths = ["**/*.pem", "**/*.key", "**/id_rsa*", "**/id_ed25519*", "**/id_ecdsa*"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-ssh-dir"
description = "Block access to the SSH configuration directory"
scope = ["read", "search", "write"]
paths = ["**/.ssh/**"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-aws-dir"
description = "Block access to AWS credentials directory"
scope = ["read", "search", "write"]
paths = ["**/.aws/**"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-gnupg-dir"
description = "Block access to the GnuPG keyring directory"
scope = ["read", "search", "write"]
paths = ["**/.gnupg/**"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-wallet-dirs"
description = "Block access to cryptocurrency wallet directories"
scope = ["read", "search", "write"]
paths = ["**/.electrum/**", "**/Electrum/**", "**/.monero/**", "**/Wallets/**"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-credentials-files"
description = "Block access to credentials files anywhere"
scope = ["read", "search", "write"]
paths = ["**/credentials*", "**/.npmrc", "**/.netrc", "**/.pypirc"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-etc-passwd-read"
description = "Block reads of system account databases"
scope = ["read"]
paths = ["/etc/passwd", "/etc/shadow", "/etc/sudoers"]
action = "deny"
severity = "high"
enabled = true

[[rule]]
id = "deny-exec-cloud-secret-exfil"
description = "Block cloud credential collection and remote extraction"
scope = ["exec"]
paths = []
commands = [
  "(?i)\\b(gcloud|aws|az|kubectl)\\b.*\\b(secret|credential|config|keyring|secret[s]?\\s+list)\\b",
  "(?i)\\b(curl|wget|nc|ncat|ssh|scp)\\b.*(~|\\$HOME|/home/|/Users/)?/?(\\.ssh|\\.aws|\\.config/gcloud|\\.kube)",
]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-exec-reverse-shell"
description = "Block common reverse-shell interpreters"
scope = ["exec"]
paths = []
commands = [
  "(?i)\\b(bash|sh|zsh|python[23]?|perl|ruby|php|nc|ncat)\\b.*\\s(-e\\s*(/bin/(ba|z)?sh|cmd\\.exe|powershell)|/dev/(tcp|udp)/)",
]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-exec-package-script-network"
description = "Block package lifecycle scripts invoking remote payloads"
scope = ["exec"]
paths = []
commands = [
  "(?i)\\b(npm|pnpm|yarn|bun|pip|pip3|gem|cargo)\\b.*\\b(curl|wget|iwr|invoke-webrequest|http[s]?://)\\b",
]
action = "deny"
severity = "high"
enabled = true

[[rule]]
id = "deny-exec-base64-shell"
description = "Block base64 payloads piped into a shell"
scope = ["exec"]
paths = []
commands = [
  "(?i)\\bbase64\\b.*\\|\\s*(ba|z|k)?sh\\b",
  "(?i)\\becho\\b.*\\|\\s*(ba|z|k)?sh\\b",
]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-exec-history-and-key wiping"
description = "Block shell history and secure disk wiping commands"
scope = ["exec"]
paths = []
commands = [
  "(?i)(^|\\s|;)history\\s+-c",
  "(?i)(^|\\s|;)unset\\s+HISTFILE",
  "(?i)\\b(shred|wipe|srm|cipher)\\b.*/(dev/|home/|users/)",
]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-exec-root-recursive-delete"
description = "Block recursive deletion of filesystem root"
# Coverage: short flags with r and/or f (`rm -rf /`), long flags
# (`rm --recursive /`), flag clusters containing other flags
# (`rm -rf --no-preserve-root /`), and unexpanded-glob targets
# (`rm -rf /*`, also under sudo). Target is deliberately narrowed to
# bare root forms (`/` and `/*`) so deeper paths like `/home/u/tmp`
# fall through to the warn-level home-delete rule below
# (first-match-wins). Flag clusters must contain an r or f somewhere;
# `rm --help /` style false negatives accepted.
scope = ["exec"]
paths = []
commands = ["rm\\s+(-{1,2}[a-zA-Z-]*[rf][a-zA-Z-]*\\s+)+/\\*?\\s*$", "(^|\\s)sudo\\s+rm\\s+.*\\s+/\\*?\\s*$"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-exec-sudo-system-write"
description = "Block sudo writes into system directories"
# Coverage: any sudo invocation whose arguments end in a system path
# (`sudo cp/mv/install <file> /etc/...`; read overblocking like
# `sudo cat /etc/passwd` accepted), direct output redirection, and
# `sudo tee` into a system path.
scope = ["exec"]
paths = []
commands = ["sudo\\s+\\S+\\s+(/etc/|/usr/|/boot/|/etc\\\\|C:\\\\Windows)", "sudo\\s+.*\\s+(>>?|tee)\\s+/(etc|usr|boot)/", "sudo\\s+.*\\s+/(etc|usr|boot)/"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "warn-exec-home-recursive-delete"
description = "Warn on recursive deletion targeting the home directory"
scope = ["exec"]
paths = []
commands = ["rm\\s+(-[a-zA-Z]*[rf][a-zA-Z]*\\s+)+(~|\\$HOME|/home/)", "(^|\\s)sudo\\s+rm\\s+.*\\s+(~|\\$HOME|/home/)"]
action = "warn"
severity = "high"
enabled = true

[[rule]]
id = "warn-exec-windows-system-delete"
description = "Warn on deletes targeting Windows system directories"
scope = ["exec"]
paths = []
commands = ["(?i)(rd|rmdir|del)\\s+.*c:\\\\windows"]
action = "warn"
severity = "high"
enabled = true

[[rule]]
id = "deny-net-metadata-services"
description = "Block network calls to cloud metadata endpoints"
scope = ["net"]
paths = []
commands = ["169\\.254\\.169\\.254", "metadata\\.google\\.internal"]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "warn-net-curl-pipe-shell"
description = "Warn on curl|wget output piped into a shell"
scope = ["net"]
paths = []
commands = ["(?i)\\b(curl|wget)\\b[^|]*\\|\\s*(ba|z|f)?sh"]
action = "warn"
severity = "high"
enabled = true
