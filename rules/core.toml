paths = [
  "**/Cookies",
  "**/Login Data",
  "**/Login Data For Account",
  "**/login.keychain-db",
]
action = "deny"
severity = "critical"
enabled = true

[[rule]]
id = "deny-system-identity-writes"
description = "Block writes to system identity and scheduler files"
scope = ["write", "delete", "rename"]
paths = [
  "/etc/hostname",
  "/etc/hosts",
  "/etc/crontab",
  "/etc/cron.*/**",
  "/etc/systemd/system/**",
  "C:/Windows/System32/drivers/etc/hosts",
]
